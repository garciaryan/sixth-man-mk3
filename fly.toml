# One machine only, ever: SQLite lives on its volume and the sync worker is in-process.
app = 'sixth-man'
primary_region = 'sjc'

[build]

[env]
  DATA_DIR = '/data'
  NODE_ENV = 'production'

[[mounts]]
  source = 'sixth_data'
  destination = '/data'

[http_service]
  internal_port = 3000
  force_https = true
  # Suspend (not stop) when idle: resuming is near-instant. The nightly cron request wakes it.
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '10s'
    path = '/api/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
